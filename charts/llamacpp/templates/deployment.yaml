apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llamacpp.fullname" . }}
  labels:
    {{- include "llamacpp.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "llamacpp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "llamacpp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with (include "llamacpp.runtimeClassName" .) }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ include "llamacpp.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LLAMA_ARG_HOST
              value: "0.0.0.0"
            - name: LLAMA_ARG_PORT
              value: "9931"
            - name: LLAMA_CACHE
              value: "/models"
          envFrom:
            - configMapRef:
                name: {{ include "llamacpp.fullname" . }}-config
          ports:
            - name: http
              containerPort: 9931
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- include "llamacpp.probe" .Values.livenessProbe | nindent 14 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- include "llamacpp.probe" .Values.readinessProbe | nindent 14 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- include "llamacpp.probe" .Values.startupProbe | nindent 14 }}
          {{- end }}
          {{- $baseResources := .Values.resources | default dict }}
          {{- $gpuResources  := include "llamacpp.gpuResources" . | fromYaml }}
          {{- $merged        := mergeOverwrite (deepCopy $baseResources) $gpuResources }}
          {{- if $merged }}
          resources:
            {{- toYaml $merged | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: models
              mountPath: /models
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "llamacpp.fullname" . }}-models
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
