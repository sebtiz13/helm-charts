apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llamacpp.fullname" . }}-config
  labels:
    {{- include "llamacpp.labels" . | nindent 4 }}
data:
  LLAMA_ARG_N_GPU_LAYERS: {{ .Values.llamacpp.nGpuLayers | quote }}
  {{- if .Values.llamacpp.nCpuFfn }}
  LLAMA_ARG_N_CPU_FFN: {{ .Values.llamacpp.nCpuFfn | quote }}
  {{- end }}
  LLAMA_ARG_CTX_SIZE: {{ .Values.llamacpp.contextSize | quote }}
  LLAMA_ARG_N_PARALLEL: {{ .Values.llamacpp.parallelSlots | quote }}
  {{- if .Values.llamacpp.alias }}
  LLAMA_ARG_ALIAS: {{ .Values.llamacpp.alias | quote }}
  {{- end }}
  {{- if .Values.llamacpp.timeout }}
  LLAMA_ARG_TIMEOUT: {{ .Values.llamacpp.timeout | quote }}
  {{- end }}
  {{- if .Values.llamacpp.threadsHttp }}
  LLAMA_ARG_THREADS_HTTP: {{ .Values.llamacpp.threadsHttp | quote }}
  {{- end }}
  {{- if .Values.llamacpp.reusePort }}
  LLAMA_ARG_REUSE_PORT: {{ .Values.llamacpp.reusePort | quote }}
  {{- end }}
  {{- if .Values.llamacpp.noHost }}
  LLAMA_ARG_NO_HOST: {{ .Values.llamacpp.noHost | quote }}
  {{- end }}
  {{- if .Values.llamacpp.ssePingInterval }}
  LLAMA_ARG_SSE_PING_INTERVAL: {{ .Values.llamacpp.ssePingInterval | quote }}
  {{- end }}
  {{- if .Values.llamacpp.nPredict }}
  LLAMA_ARG_N_PREDICT: {{ .Values.llamacpp.nPredict | quote }}
  {{- end }}
  {{- if .Values.llamacpp.reranking }}
  LLAMA_ARG_RERANKING: {{ .Values.llamacpp.reranking | quote }}
  {{- end }}
  {{- if .Values.llamacpp.perf }}
  LLAMA_ARG_PERF: {{ .Values.llamacpp.perf | quote }}
  {{- end }}
  {{- if .Values.llamacpp.offline }}
  LLAMA_ARG_OFFLINE: {{ .Values.llamacpp.offline | quote }}
  {{- end }}

  # -- Threading & GPU --
  {{- if .Values.llamacpp.threads }}
  LLAMA_ARG_THREADS: {{ .Values.llamacpp.threads | quote }}
  {{- end }}
  {{- if .Values.llamacpp.mainGpu }}
  LLAMA_ARG_MAIN_GPU: {{ .Values.llamacpp.mainGpu | quote }}
  {{- end }}
  {{- if .Values.llamacpp.threadsBatch }}
  LLAMA_ARG_THREADS_BATCH: {{ .Values.llamacpp.threadsBatch | quote }}
  {{- end }}
  {{- if .Values.llamacpp.numa }}
  LLAMA_ARG_NUMA: {{ .Values.llamacpp.numa | quote }}
  {{- end }}
  {{- if .Values.llamacpp.rpc }}
  LLAMA_ARG_RPC: {{ .Values.llamacpp.rpc | quote }}
  {{- end }}

  # -- Model loading --
  {{- if .Values.llamacpp.model }}
  {{- if .Values.llamacpp.model.hf }}
  LLAMA_ARG_HF_REPO: {{ .Values.llamacpp.model.hf | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.model }}
  LLAMA_ARG_MODEL: {{ .Values.llamacpp.model.model | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.modelUrl }}
  LLAMA_ARG_MODEL_URL: {{ .Values.llamacpp.model.modelUrl | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.hfFile }}
  LLAMA_ARG_HF_FILE: {{ .Values.llamacpp.model.hfFile | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.mmproj }}
  LLAMA_ARG_MMPROJ: {{ .Values.llamacpp.model.mmproj | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.mmprojUrl }}
  LLAMA_ARG_MMPROJ_URL: {{ .Values.llamacpp.model.mmprojUrl | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.mmprojAuto }}
  LLAMA_ARG_MMPROJ_AUTO: {{ .Values.llamacpp.model.mmprojAuto | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.overrideTensor }}
  LLAMA_ARG_OVERRIDE_TENSOR: {{ .Values.llamacpp.model.overrideTensor | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.loadMode }}
  LLAMA_ARG_LOAD_MODE: {{ .Values.llamacpp.model.loadMode | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.lazyMode }}
  LLAMA_ARG_LAZY_MODE: {{ .Values.llamacpp.model.lazyMode | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.repack }}
  LLAMA_ARG_REPACK: {{ .Values.llamacpp.model.repack | quote }}
  {{- end }}

  # Multi-model (router mode)
  {{- if .Values.llamacpp.model.modelsDir }}
  LLAMA_ARG_MODELS_DIR: {{ .Values.llamacpp.model.modelsDir | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.modelsMax }}
  LLAMA_ARG_MODELS_MAX: {{ .Values.llamacpp.model.modelsMax | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.modelsMemoryMargin }}
  LLAMA_ARG_MODELS_MEMORY_MARGIN: {{ .Values.llamacpp.model.modelsMemoryMargin | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.modelsAutoload }}
  LLAMA_ARG_MODELS_AUTOLOAD: {{ .Values.llamacpp.model.modelsAutoload | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.dockerRepo }}
  LLAMA_ARG_DOCKER_REPO: {{ .Values.llamacpp.model.dockerRepo | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.tags }}
  LLAMA_ARG_TAGS: {{ .Values.llamacpp.model.tags | quote }}
  {{- end }}

  # Multimodal / vision
  {{- if .Values.llamacpp.model.mmprojOffload }}
  LLAMA_ARG_MMPROJ_OFFLOAD: {{ .Values.llamacpp.model.mmprojOffload | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.imageMaxTokens }}
  LLAMA_ARG_IMAGE_MAX_TOKENS: {{ .Values.llamacpp.model.imageMaxTokens | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.imageMinTokens }}
  LLAMA_ARG_IMAGE_MIN_TOKENS: {{ .Values.llamacpp.model.imageMinTokens | quote }}
  {{- end }}
  {{- if .Values.llamacpp.model.mtmdBatchMaxTokens }}
  LLAMA_ARG_MTMD_BATCH_MAX_TOKENS: {{ .Values.llamacpp.model.mtmdBatchMaxTokens | quote }}
  {{- end }}
  {{- end }}

  {{- if .Values.llamacpp.fit }}
  {{- if .Values.llamacpp.fit.enabled }}
  LLAMA_ARG_FIT: {{ .Values.llamacpp.fit.enabled | quote }}
  {{- end }}
  {{- if .Values.llamacpp.fit.fitCtx }}
  LLAMA_ARG_FIT_CTX: {{ .Values.llamacpp.split.fitCtx | quote }}
  {{- end }}
  {{- if .Values.llamacpp.fit.fitTarget }}
  LLAMA_ARG_FIT_TARGET: {{ .Values.llamacpp.fit.fitTarget | quote }}
  {{- end }}
  {{- end }}

  {{- if .Values.llamacpp.split }}
  {{- if .Values.llamacpp.split.mode }}
  LLAMA_ARG_SPLIT_MODE: {{ .Values.llamacpp.split.mode | quote }}
  {{- end }}
  {{- if .Values.llamacpp.split.tensor }}
  LLAMA_ARG_TENSOR_SPLIT: {{ .Values.llamacpp.split.tensor | quote }}
  {{- end }}
  {{- if .Values.llamacpp.split.device }}
  LLAMA_ARG_DEVICE: {{ .Values.llamacpp.split.device | quote }}
  {{- end }}
  {{- end }}

  # -- MoE (Mixture of Experts) --
  {{- if .Values.llamacpp.moe }}
  {{- if .Values.llamacpp.moe.cpuOffload }}
  LLAMA_ARG_CPU_MOE: {{ .Values.llamacpp.moe.cpuOffload | quote }}
  {{- end }}
  {{- if .Values.llamacpp.moe.nCpuLayers }}
  LLAMA_ARG_N_CPU_MOE: {{ .Values.llamacpp.moe.nCpuLayers | quote }}
  {{- end }}
  {{- if .Values.llamacpp.moe.cacheMib }}
  LLAMA_ARG_MOE_CACHE_MIB: {{ .Values.llamacpp.moe.cacheMib | quote }}
  {{- end }}
  {{- if .Values.llamacpp.moe.cacheCpuShare }}
  LLAMA_ARG_MOE_CACHE_CPU_SHARE: {{ .Values.llamacpp.moe.cacheCpuShare | quote }}
  {{- end }}
  {{- end }}

  # -- Attention & KV cache --
  {{- if .Values.llamacpp.flashAttn }}
  LLAMA_ARG_FLASH_ATTN: {{ .Values.llamacpp.flashAttn | quote }}
  {{- end }}
  {{- if .Values.llamacpp.cacheType }}
  {{- if .Values.llamacpp.cacheType.key }}
  LLAMA_ARG_CACHE_TYPE_K: {{ .Values.llamacpp.cacheType.key | quote }}
  {{- end }}
  {{- if .Values.llamacpp.cacheType.value }}
  LLAMA_ARG_CACHE_TYPE_V: {{ .Values.llamacpp.cacheType.value | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.llamacpp.cacheRam }}
  LLAMA_ARG_CACHE_RAM: {{ .Values.llamacpp.cacheRam | quote }}
  {{- end }}

  # -- Batching --
  {{- if .Values.llamacpp.batching }}
  {{- if .Values.llamacpp.batching.batch }}
  LLAMA_ARG_BATCH: {{ .Values.llamacpp.batching.batch | quote }}
  {{- end }}
  {{- if .Values.llamacpp.batching.ubatch }}
  LLAMA_ARG_UBATCH: {{ .Values.llamacpp.batching.ubatch | quote }}
  {{- end }}
  {{- if .Values.llamacpp.batching.contBatching }}
  LLAMA_ARG_CONT_BATCHING: {{ .Values.llamacpp.batching.contBatching | quote }}
  {{- end }}
  {{- end }}

  # -- Speculative decoding --
  {{- if .Values.llamacpp.speculativeDraft }}
  {{- if .Values.llamacpp.speculativeDraft.type }}
  LLAMA_ARG_SPEC_TYPE: {{ .Values.llamacpp.speculativeDraft.type | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftModel }}
  LLAMA_ARG_SPEC_DRAFT_MODEL: {{ .Values.llamacpp.speculativeDraft.draftModel | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftHfRepo }}
  LLAMA_ARG_SPEC_DRAFT_HF_REPO: {{ .Values.llamacpp.speculativeDraft.draftHfRepo | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftNgl }}
  LLAMA_ARG_N_GPU_LAYERS_DRAFT: {{ .Values.llamacpp.speculativeDraft.draftNgl | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftNMin }}
  LLAMA_ARG_SPEC_DRAFT_N_MIN: {{ .Values.llamacpp.speculativeDraft.draftNMin | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftNMax }}
  LLAMA_ARG_SPEC_DRAFT_N_MAX: {{ .Values.llamacpp.speculativeDraft.draftNMax | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftPMin }}
  LLAMA_ARG_SPEC_DRAFT_P_MIN: {{ .Values.llamacpp.speculativeDraft.draftPMin | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftNUbatch }}
  LLAMA_ARG_SPEC_DRAFT_N_UBATCH: {{ .Values.llamacpp.speculativeDraft.draftNUbatch | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftPSplit }}
  LLAMA_ARG_SPEC_DRAFT_P_SPLIT: {{ .Values.llamacpp.speculativeDraft.draftPSplit | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftSampling }}
  LLAMA_ARG_SPEC_DRAFT_SAMPLING: {{ .Values.llamacpp.speculativeDraft.draftSampling | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftBackendSampling }}
  LLAMA_ARG_SPEC_DRAFT_BACKEND_SAMPLING: {{ .Values.llamacpp.speculativeDraft.draftBackendSampling | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftCpuMoe }}
  LLAMA_ARG_SPEC_DRAFT_CPU_MOE: {{ .Values.llamacpp.speculativeDraft.draftCpuMoe | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.draftNCpuMoe }}
  LLAMA_ARG_SPEC_DRAFT_N_CPU_MOE: {{ .Values.llamacpp.speculativeDraft.draftNCpuMoe | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.synthLen }}
  LLAMA_ARG_SPEC_SYNTH_LEN: {{ .Values.llamacpp.speculativeDraft.synthLen | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.synthRates }}
  LLAMA_ARG_SPEC_SYNTH_RATES: {{ .Values.llamacpp.speculativeDraft.synthRates | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.cacheType }}
  {{- if .Values.llamacpp.speculativeDraft.cacheType.key }}
  LLAMA_ARG_SPEC_DRAFT_CACHE_TYPE_K: {{ .Values.llamacpp.speculativeDraft.cacheType.key | quote }}
  {{- end }}
  {{- if .Values.llamacpp.speculativeDraft.cacheType.value }}
  LLAMA_ARG_SPEC_DRAFT_CACHE_TYPE_V: {{ .Values.llamacpp.speculativeDraft.cacheType.value | quote }}
  {{- end }}
  {{- end }}
  {{- end }}

  # -- Sampling --
  {{- if .Values.llamacpp.sampling }}
  {{- if .Values.llamacpp.sampling.temperature }}
  LLAMA_ARG_TEMPERATURE: {{ .Values.llamacpp.sampling.temperature | quote }}
  {{- end }}
  {{- if .Values.llamacpp.sampling.topP }}
  LLAMA_ARG_TOP_P: {{ .Values.llamacpp.sampling.topP | quote }}
  {{- end }}
  {{- if .Values.llamacpp.sampling.topK }}
  LLAMA_ARG_TOP_K: {{ .Values.llamacpp.sampling.topK | quote }}
  {{- end }}
  {{- if .Values.llamacpp.sampling.minP }}
  LLAMA_ARG_MIN_P: {{ .Values.llamacpp.sampling.minP | quote }}
  {{- end }}
  {{- if .Values.llamacpp.sampling.repeatPenalty }}
  LLAMA_ARG_REPEAT_PENALTY: {{ .Values.llamacpp.sampling.repeatPenalty | quote }}
  {{- end }}
  {{- if .Values.llamacpp.sampling.presencePenalty }}
  LLAMA_ARG_PRESENCE_PENALTY: {{ .Values.llamacpp.sampling.presencePenalty | quote }}
  {{- end }}
  {{- if .Values.llamacpp.sampling.frequencyPenalty }}
  LLAMA_ARG_FREQUENCY_PENALTY: {{ .Values.llamacpp.sampling.frequencyPenalty | quote }}
  {{- end }}
  {{- end }}

  # -- Reasoning --
  {{- if .Values.llamacpp.reasoning }}
  {{- if .Values.llamacpp.reasoning.enabled }}
  LLAMA_ARG_REASONING: {{ .Values.llamacpp.reasoning.enabled | quote }}
  {{- end }}
  {{- if .Values.llamacpp.reasoning.format }}
  LLAMA_ARG_THINK: {{ .Values.llamacpp.reasoning.format | quote }}
  {{- end }}
  {{- if .Values.llamacpp.reasoning.effort }}
  LLAMA_ARG_REASONING_EFFORT: {{ .Values.llamacpp.reasoning.effort | quote }}
  {{- end }}
  {{- if .Values.llamacpp.reasoning.budget }}
  LLAMA_ARG_THINK_BUDGET: {{ .Values.llamacpp.reasoning.budget | quote }}
  {{- end }}
  {{- if .Values.llamacpp.reasoning.budgetMessage }}
  LLAMA_ARG_THINK_BUDGET_MESSAGE: {{ .Values.llamacpp.reasoning.budgetMessage | quote }}
  {{- end }}
  {{- if .Values.llamacpp.reasoning.preserve }}
  LLAMA_ARG_REASONING_PRESERVE: {{ .Values.llamacpp.reasoning.preserve | quote }}
  {{- end }}
  {{- end }}

  # -- Embeddings & Reranking --
  {{- if .Values.llamacpp.embedding }}
  {{- if .Values.llamacpp.embedding.enabled }}
  LLAMA_ARG_EMBEDDINGS: {{ .Values.llamacpp.embedding.enabled | quote }}
  {{- end }}
  {{- if .Values.llamacpp.embedding.pooling }}
  LLAMA_ARG_POOLING: {{ .Values.llamacpp.embedding.pooling | quote }}
  {{- end }}
  {{- end }}

  # -- Inference options --
  {{- if .Values.llamacpp.kvUnified }}
  LLAMA_ARG_KV_UNIFIED: {{ .Values.llamacpp.kvUnified | quote }}
  {{- end }}

  # -- Web UI --
  {{- if .Values.llamacpp.webui }}
  {{- if hasKey .Values.llamacpp.webui "enabled" }}
  LLAMA_ARG_UI: {{ .Values.llamacpp.webui.enabled | quote }}
  {{- end }}
  {{- if hasKey .Values.llamacpp.webui "mcpProxy" }}
  LLAMA_ARG_UI_MCP_PROXY: {{ .Values.llamacpp.webui.mcpProxy | quote }}
  {{- end }}
  {{- if .Values.llamacpp.webui.staticPath }}
  LLAMA_ARG_STATIC_PATH: {{ .Values.llamacpp.webui.staticPath | quote }}
  {{- end }}
  {{- end }}

  # -- MCP (Model Context Protocol) --
  {{- if .Values.llamacpp.mcp }}
  {{- if .Values.llamacpp.mcp.serversConfigFile }}
  LLAMA_ARG_MCP_SERVERS_CONFIG: {{ .Values.llamacpp.mcp.serversConfigFile | quote }}
  {{- end }}
  {{- if .Values.llamacpp.mcp.serversJson }}
  LLAMA_ARG_MCP_SERVERS_JSON: {{ .Values.llamacpp.mcp.serversJson | quote }}
  {{- end }}
  {{- end }}

  # -- Networking --
  {{- if .Values.llamacpp.network }}
  {{- if .Values.llamacpp.network.apiKeyFile }}
  LLAMA_ARG_API_KEY_FILE: {{ .Values.llamacpp.network.apiKeyFile | quote }}
  {{- end }}
  {{- if .Values.llamacpp.network.apiPrefix }}
  LLAMA_ARG_API_PREFIX: {{ .Values.llamacpp.network.apiPrefix | quote }}
  {{- end }}
  {{- if .Values.llamacpp.network.connect }}
  LLAMA_ARG_CONNECT: {{ .Values.llamacpp.network.connect | quote }}
  {{- end }}
  {{- if .Values.llamacpp.network.connectCode }}
  LLAMA_ARG_CONNECT_CODE: {{ .Values.llamacpp.network.connectCode | quote }}
  {{- end }}
  {{- if .Values.llamacpp.network.sslCertFile }}
  LLAMA_ARG_SSL_CERT_FILE: {{ .Values.llamacpp.network.sslCertFile | quote }}
  {{- end }}
  {{- if .Values.llamacpp.network.sslKeyFile }}
  LLAMA_ARG_SSL_KEY_FILE: {{ .Values.llamacpp.network.sslKeyFile | quote }}
  {{- end }}
  {{- if .Values.llamacpp.network.corsOrigins }}
  LLAMA_ARG_CORS_ORIGINS: {{ .Values.llamacpp.network.corsOrigins | quote }}
  {{- end }}
  {{- if .Values.llamacpp.network.corsHeaders }}
  LLAMA_ARG_CORS_HEADERS: {{ .Values.llamacpp.network.corsHeaders | quote }}
  {{- end }}
  {{- if .Values.llamacpp.network.corsMethods }}
  LLAMA_ARG_CORS_METHODS: {{ .Values.llamacpp.network.corsMethods | quote }}
  {{- end }}
  {{- if hasKey .Values.llamacpp.network "corsCredentials" }}
  LLAMA_ARG_CORS_CREDENTIALS: {{ .Values.llamacpp.network.corsCredentials | quote }}
  {{- end }}
  {{- end }}

  # -- Logging --
  {{- if .Values.llamacpp.logging }}
  {{- if hasKey .Values.llamacpp.logging "verbosity" }}
  LLAMA_ARG_LOG_VERBOSITY: {{ .Values.llamacpp.logging.verbosity | quote }}
  {{- end }}
  {{- if .Values.llamacpp.logging.file }}
  LLAMA_ARG_LOG_FILE: {{ .Values.llamacpp.logging.file | quote }}
  {{- end }}
  {{- if hasKey .Values.llamacpp.logging "jsonl" }}
  LLAMA_ARG_LOG_JSONL: {{ .Values.llamacpp.logging.jsonl | quote }}
  {{- end }}
  {{- if hasKey .Values.llamacpp.logging "colors" }}
  LLAMA_ARG_LOG_COLORS: {{ .Values.llamacpp.logging.colors | quote }}
  {{- end }}
  {{- if hasKey .Values.llamacpp.logging "prefix" }}
  LLAMA_ARG_LOG_PREFIX: {{ .Values.llamacpp.logging.prefix | quote }}
  {{- end }}
  {{- if hasKey .Values.llamacpp.logging "timestamps" }}
  LLAMA_ARG_LOG_TIMESTAMPS: {{ .Values.llamacpp.logging.timestamps | quote }}
  {{- end }}
  {{- end }}

  # -- Extra arbitrary env vars --
  {{- range $key, $value := .Values.llamacpp.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
