apiVersion: v1
kind: Service
metadata:
  name: {{ include "llamacpp.fullname" . }}
  labels:
    {{- include "llamacpp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9931
      protocol: TCP
      name: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.port }}
      {{- end }}
  selector:
    {{- include "llamacpp.selectorLabels" . | nindent 4 }}
