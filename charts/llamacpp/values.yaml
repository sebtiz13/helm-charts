# Number of replicas for the llama-server deployment
replicaCount: 1

# Deployment strategy configuration
# If null, no strategy is defined (Kubernetes default will apply)
# Example:
# strategy:
#   type: RollingUpdate
#   rollingUpdate:
#     maxSurge: 1
#     maxUnavailable: 0
strategy: null

image:
  repository: ghcr.io/ggml-org/llama.cpp
  # Overrides the image tag. Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# List of image pull secrets for private registries
imagePullSecrets: []

# Override the chart name
nameOverride: ""
# Override the full release name
fullnameOverride: ""

# Annotations for the Deployment resource
annotations: {}

# Annotations added to each Pod
podAnnotations: {}

# Security context applied at the Pod level
podSecurityContext: {}

# Security context applied at the container level
securityContext: {}

service:
  type: ClusterIP
  # Port exposed by the Kubernetes service
  port: 9931

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: llamacpp.example.com
  tls:
    enabled: false
    # Overrides TLS host
    # host: llamacpp.example.com
    # Secret could be manually created in the namespace
    # secretName: llamacpp-tls

# llama-server configuration via environment variables.
# These are injected into the container via a ConfigMap (envFrom).
llamacpp:
  # Number of GPU layers to offload (0 = CPU only)
  nGpuLayers: "0"
  # Context window size
  contextSize: "4096"
  # Number of parallel request slots
  parallelSlots: "1"
  # Model name alias exposed in the API (comma-separated)
  # alias: "gpt-4,my-model"
  # Server read/write timeout in seconds (default: 600)
  # timeout: "600"
  # Number of threads used to process HTTP requests (default: -1)
  # threadsHttp: "-1"
  # Enable SO_REUSEPORT so multiple instances can bind the same port (1 = enable / 0 = disabled)
  # reusePort: "0"
  # Bypass host buffer, allowing extra buffers to be used (1 = enable / 0 = disabled)
  # noHost: "0"
  # Interval between SSE keep-alive pings in seconds (default: 15)
  # ssePingInterval: "15"
  # Number of tokens to predict (default: -1, -1 = infinity)
  # nPredict: "-1"
  # Enable the /rerank endpoint for cross-encoder reranking (1 = enable / 0 = disabled)
  # reranking: "0"
  # Enable internal libllama performance timings (1 = enable / 0 = disabled)
  # perf: "0"
  # Disable any network access: HF downloads, model router, etc. (1 = enable / 0 = disabled)
  # offline: "0"

  # -- Threading & GPU --
  # Number of CPU threads to use for generation
  # threads: "2"
  # Index of the GPU to use as main GPU for tensor operations
  # mainGpu: "0"
  # Number of threads for batch / prompt processing (default: same as threads)
  # threadsBatch: "4"
  # NUMA optimization strategy: distribute, isolate, numactl (default: disabled)
  # numa: distribute
  # Comma-separated list of RPC servers (host:port) for distributed inference
  # rpc: "192.168.1.10:50052,192.168.1.11:50052"
  # Keep dense FFN weights of the first N layers in the CPU (non-MoE counterpart of nCpuLayers)
  # nCpuFfn: "10"

  # -- Model loading --
  # model:
  #   # Hugging Face model repository
  #   # hf: "<user>/<model>:<tag>"
  #   # Model path inside the container
  #   # model: "/models/model.gguf"
  #   # URL to download model from (direct download, alternative to --hf-repo)
  #   # modelUrl: "https://example.com/model.gguf"
  #   # HuggingFace model filename / glob pattern to select a specific GGUF file
  #   # hfFile: "*.gguf"
  #   # Path to a multimodal projector file
  #   # mmproj: "/models/mmproj-model.gguf"
  #   # URL to download multimodal projector from
  #   # mmprojUrl: "https://example.com/mmproj.gguf"
  #   # Whether to use multimodal projector file (if available), useful when using hf model (1 = enabled / 0 = disabled, default enabled)
  #   # mmprojAuto: 0
  #   # Override tensor buffer type (e.g. ATTN=CPU)
  #   # overrideTensor: "ATTN=CPU"
  #   # Model loading mode: auto, mmap, direct (default: auto)
  #   # loadMode: "auto"
  #   # On-demand tensor reading per-layer: auto, 1, 0 (default: auto)
  #   # lazyMode: "auto"
  #   # Whether to enable weight repacking (1 = enabled / 0 = disabled, default: 1)
  #   # repack: "1"
  #   # Directory to scan for GGUF model files (enables model listing endpoint)
  #   # modelsDir: "/models"
  #   # Maximum number of models loaded simultaneously (default: 1)
  #   # modelsMax: "1"
  #   # VRAM margin reserved for non-model use when auto-loading in MiB (default: 0)
  #   # modelsMemoryMargin: "0"
  #   # Auto-load models on first request (1 = enable / 0 = disabled, default: 1)
  #   # modelsAutoload: "1"
  #   # Docker Hub image repository used by the model router
  #   # dockerRepo: ""
  #   # Model tags to attach, comma-separated (used in model listing)
  #   # tags: ""
  #   # Whether to offload the multimodal projector to GPU (1 = enable / 0 = disabled, default: 1)
  #   # mmprojOffload: "1"
  #   # Maximum number of image tokens to generate per image (default: 0 = from model)
  #   # imageMaxTokens: "0"
  #   # Minimum number of image tokens per image (default: 0 = from model)
  #   # imageMinTokens: "0"
  #   # Maximum tokens in one multimodal batch (default: 0 = unlimited)
  #   # mtmdBatchMaxTokens: "0"

  # -- Fit controls
  # fit:
  #   # Auto-fit model to available VRAM: "on" or "off" (default: "off")
  #   # enabled: "on"
  #   # Target context size when using fit (default: "0")
  #   # fitCtx: "4096"
  #   # Target VRAM usage ratio when using fit (default: "0.90")
  #   # fitTarget: "0.90"

  # How to split the model across multiple GPUs
  # split:
  #   # Mode of split the model across GPUs, one of:
  #   # - none: use one GPU only
  #   # - layer (default): split layers and KV across GPUs (pipelined)
  #   # - row: split weight across GPUs by rows (parallelized)
  #   # - tensor: split weights and KV across GPUs (parallelized, EXPERIMENTAL)
  #   mode: layer
  #   # Fraction of the model to offload to each GPU (comma-separated, optional)
  #   tensor: "2.1,1"
  #   # Comma-separated list of GPU devices to use for offloading
  #   device: "0,1"

  # -- MoE (Mixture of Experts) --
  # Group of settings for Mixture of Experts models (e.g. DeepSeek, Qwen MoE)
  # moe:
  #   # Keep all MoE feed-forward weights in CPU RAM instead of VRAM (1 = enable / 0 = disabled)
  #   # Useful for large MoE models on GPUs with limited VRAM
  #   cpuOffload: "1"
  #   # Keep MoE weights of the first N layers in CPU (overrides cpuOffload for those layers)
  #   # nCpuLayers: "10"
  #   # GPU cache size in MiB dedicated to frequently used MoE experts (default: 0 = disabled)
  #   cacheMib: "2048"
  #   # Share/ratio for MoE cache misses handled via host/CPU memory (float, e.g. "0.5")
  #   cacheCpuShare: "0.5"

  # -- Attention & KV cache --
  # Enable flash attention: "on" to enable ('on', 'off', or 'auto', default: 'auto')
  # flashAttn: "on"
  # KV cache quantization types for keys and values: f16, q8_0, q4_0, etc.
  # cacheType:
  #   key: q8_0
  #   value: q8_0
  # Amount of KV cache to keep in CPU RAM in MiB
  # cacheRam: "6144"

  # -- Batching --
  # batch: logical max batch size, ubatch: physical max batch size
  # batching:
  #   batch: "2048"
  #   ubatch: '1024"
  #   # contBatching: enable continuous batching — "1" to enable
  #   contBatching: "1"

  # -- Speculative decoding --
  # Group of settings related to speculative decoding / draft models
  # speculativeDraft:
  #   # Speculative decoding type, e.g. draft-mtp
  #   type: draft-mtp
  #   # Path to the draft model for speculative decoding
  #   draftModel: ""
  #   # HuggingFace repo for the draft model (e.g. USER/MODEL[:Q])
  #   draftHfRepo: ""
  #   # Number of draft model layers to store in VRAM (default: auto)
  #   draftNgl: "auto"
  #   # Minimum number of draft tokens to use (default: 0)
  #   draftNMin: "0"
  #   # Maximum number of draft tokens to generate
  #   draftNMax: "4"
  #   # Minimum draft acceptance probability
  #   draftPMin: "0.60"
  #   # Physical max batch size for the draft context (default: 0 = same as --ubatch)
  #   draftNUbatch: "0"
  #   # Speculative decoding split probability (default: 0.10)
  #   draftPSplit: "0.10"
  #   # How the draft is sampled: greedy, probabilistic (default: greedy)
  #   draftSampling: "greedy"
  #   # Offload draft token sampling to the backend (1 = enable / 0 = disabled, default: 1)
  #   draftBackendSampling: "1"
  #   # Keep all MoE weights in CPU for the draft model (1 = enable / 0 = disabled)
  #   draftCpuMoe: "0"
  #   # Keep MoE weights of first N layers in CPU for the draft model
  #   draftNCpuMoe: "0"
  #   # Target mean synthetic acceptance length (benchmarking only)
  #   synthLen: "0"
  #   # Per-position synthetic acceptance probabilities, comma-separated (benchmarking only)
  #   synthRates: ""
  #   cacheType:
  #     key: "q8_0"
  #     value: "q8_0"

  # -- Sampling --
  # temperature: sampling temperature, topP/topK/minP: nucleus/top-k/min-p thresholds
  # repeatPenalty, presencePenalty, frequencyPenalty: penalty parameters
  # sampling:
  #   temperature: "0.6"
  #   topP: "0.95"
  #   topK: "20"
  #   minP: "0.05"
  #   repeatPenalty: "1.0"
  #   presencePenalty: "0.0"
  #   frequencyPenalty: "0.0"

  # -- Reasoning --
  # Group of settings related to reasoning / thinking models (e.g. DeepSeek R1, Qwen reasoning)
  # reasoning:
  #   # Toggle reasoning/thinking features ("on", "off" or "auto", default "auto" (detect from template))
  #   enabled: "auto"
  #   # Reasoning format / thought parsing (e.g. "auto", "deepseek", "deepseek-legacy", "none")
  #   format: "auto"
  #   # Reasoning effort level given to the chat template: 'default' to keep the template default,
  #   # or a level such as 'minimal', 'low', 'medium', 'high', 'xhigh' or 'max' (default: default)
  #   effort: "default"
  #   # Token budget for thinking: -1 for unrestricted, 0 for immediate end, N>0 for token budget (default: -1)
  #   budget: "-1"
  #   # Message injected before the end-of-thinking tag when reasoning budget is exhausted (default: none)
  #   budgetMessage: ""
  #   # preserve reasoning trace in the full history, not just the last assistant message (default: template default)
  #   # compatible with certain templates having 'supports_preserve_reasoning' capability
  #   # example: https://docs.z.ai/guides/capabilities/thinking-mode#preserved-thinking
  #   # (1 = enable / 0 = disabled)
  #   preserve: "1"

  # -- Embeddings --
  # Group of settings for embedding and reranking models
  # embedding:
  #   # Restrict to only support embedding use case; use only with dedicated embedding models (1 = enable / 0 = disabled)
  #   enabled: "0"
  #   # Pooling type for embeddings, use model default if unspecified (e.g. "none", "mean", "cls", "last", "rank")
  #   pooling: "mean"

  # -- Inference options --
  # Enable unified KV cache across sequences (1 = enable / 0 = disabled)
  # kvUnified: "1"

  # -- Web UI --
  webui:
    # Whether to enable the Web UI (1 = enable / 0 = disabled)
    enabled: "0"
    # Inline JSON string of default Web UI preferences
    # uiConfig: ""
    # Path to a JSON file of default Web UI preferences
    # uiConfigFile: ""
    # Expose an MCP proxy endpoint in the Web UI (1 = enable / 0 = disabled, default: 0)
    # mcpProxy: "0"
    # Path to serve static files from (Web UI assets)
    # staticPath: ""

  # -- MCP (Model Context Protocol) --
  # mcp:
  #   # Path to MCP servers JSON config file
  #   serversConfigFile: ""
  #   # Inline JSON string describing MCP servers to connect to
  #   serversJson: ""

  # -- Networking --
  # network:
  #   # File containing API keys for authentication (one per line)
  #   apiKeyFile: ""
  #   # Prefix path the server serves from, without trailing slash
  #   apiPrefix: ""
  #   # Connect to a remote llama.cpp server instead of running locally (HOST:PORT)
  #   connect: ""
  #   # Authentication code for connect
  #   connectCode: ""
  #   # Path to the PEM-encoded TLS certificate file
  #   sslCertFile: ""
  #   # Path to the PEM-encoded TLS private key file
  #   sslKeyFile: ""
  #   # Allowed CORS origins, comma-separated (default: *)
  #   corsOrigins: ""
  #   # Allowed CORS headers
  #   corsHeaders: ""
  #   # Allowed CORS methods
  #   corsMethods: ""
  #   # Whether to allow CORS credentials (1 = enable / 0 = disabled)
  #   corsCredentials: "0"

  # -- Logging --
  # logging:
  #   # Log verbosity level: -1 = error, 0 = info (default), 1 = debug, 2 = trace
  #   verbosity: "0"
  #   # Path to write log output to a file
  #   file: ""
  #   # Output logs in JSONL format (1 = enable / 0 = disabled, default: 0)
  #   jsonl: "0"
  #   # Use ANSI colors in log output (1 = enable / 0 = disabled, default: 1)
  #   colors: "1"
  #   # Add a module/function prefix to log lines (1 = enable / 0 = disabled, default: 0)
  #   prefix: "0"
  #   # Add timestamps to log lines (1 = enable / 0 = disabled, default: 0)
  #   timestamps: "0"

  # Additional arbitrary env vars to inject (key: value map)
  extraEnv: {}

# Persistence for model files
persistence:
  # Enable a PersistentVolumeClaim to store model files
  enabled: false
  # StorageClass name; leave empty to use the cluster default
  storageClass: ""
  accessMode: ReadWriteOnce
  # Size of the PersistentVolumeClaim
  size: 20Gi
  # Additional labels for the PVC
  labels: {}
  # Additional annotations for the PVC
  annotations: {}

# Resource requests and limits for the llama-server container
resources: {}
# Example:
#   requests:
#     cpu: 500m
#     memory: 2Gi
#   limits:
#     cpu: 2
#     memory: 8Gi

# GPU resource allocation
# When set, the vendor-specific GPU resource is added to the container's
# limits and requests, merged with any values in `resources` above.
# Supported vendors:
#   nvidia → nvidia.com/gpu  (requires NVIDIA device plugin)
#   amd    → amd.com/gpu     (requires AMD device plugin)
# gpu:
#   vendor: nvidia
#   # Runtime class for the pod (e.g., nvidia).
#   # Defaults automatically to "nvidia" if gpu.vendor is nvidia.
#   runtimeClassName: ""
#   count: 1

# Node selector for pod scheduling
nodeSelector: {}

# Tolerations for pod scheduling
tolerations: []

# Affinity rules for pod scheduling
affinity: {}

# Liveness probe configuration
livenessProbe:
  # Enable or disable the liveness probe
  enabled: true
  # httpGet:
  #   path: /health
  #   port: 9931
  #   scheme: "HTTP"  # Optional: HTTP or HTTPS
  # initialDelaySeconds: 30  # Optional: Delay before first probe
  # periodSeconds: 10       # Optional: How often to perform probe
  # timeoutSeconds: 1       # Optional: When probe times out
  # successThreshold: 1     # Optional: Minimum consecutive successes
  # failureThreshold: 30    # Optional: Minimum consecutive failures

# Readiness probe configuration
readinessProbe:
  # Enable or disable the readiness probe
  enabled: true
  # httpGet:
  #   path: /health
  #   port: 9931
  #   scheme: "HTTP"  # Optional: HTTP or HTTPS
  # initialDelaySeconds: 30  # Optional: Delay before first probe
  # periodSeconds: 10       # Optional: How often to perform probe
  # timeoutSeconds: 1       # Optional: When probe times out
  # successThreshold: 1     # Optional: Minimum consecutive successes
  # failureThreshold: 30    # Optional: Minimum consecutive failures

# Readiness probe configuration
startupProbe:
  # Enable or disable the readiness probe
  enabled: false
  # httpGet:
  #   path: /health
  #   port: 9931
  #   scheme: "HTTP"  # Optional: HTTP or HTTPS
  # initialDelaySeconds: 30  # Optional: Delay before first probe
  # periodSeconds: 10       # Optional: How often to perform probe
  # timeoutSeconds: 1       # Optional: When probe times out
  # successThreshold: 1     # Optional: Minimum consecutive successes
  # failureThreshold: 30    # Optional: Minimum consecutive failures
