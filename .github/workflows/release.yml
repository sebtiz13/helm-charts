name: Release Charts

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.1.3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package charts
        id: package-charts
        env:
          TARGET_DIR: "${{ runner.temp }}/charts_out"
        run: |
          mkdir -p "${TARGET_DIR}"

          BASE_COMMIT="${{ github.event.before }}"
          if [ -z "$BASE_COMMIT" ] || [ "$BASE_COMMIT" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "$BASE_COMMIT" >/dev/null 2>&1; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              BASE_COMMIT="HEAD~1"
            else
              BASE_COMMIT=$(git hash-object -t tree /dev/null)
            fi
          fi

          PACKAGED=false
          for chart in charts/*; do
            if [ -d "$chart" ] && [ -f "$chart/Chart.yaml" ]; then
              if git diff --name-only "$BASE_COMMIT" HEAD -- "$chart/Chart.yaml" | grep -q "Chart.yaml"; then
                echo "Packaging updated chart: $chart"
                helm dependency build "$chart"
                helm package "$chart" -d "${TARGET_DIR}"
                PACKAGED=true
              fi
            fi
          done

          if [ "$PACKAGED" = true ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "result=$(echo ${TARGET_DIR}/*.tgz)" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No chart versions were bumped."
          fi

      - name: Push charts to OCI registry
        if: steps.package-charts.outputs.has_changes == 'true'
        env:
          PACKAGES_FILES: ${{ steps.package-charts.outputs.result }}
        run: |
          for chart_package in ${PACKAGES_FILES}; do
            if [ -f "$chart_package" ]; then
              helm push "$chart_package" oci://ghcr.io/${{ github.repository }}
            fi
          done
          echo "Charts pushed to OCI registry successfully"

      - name: Checkout gh-pages
        if: steps.package-charts.outputs.has_changes == 'true'
        uses: actions/checkout@v7
        with:
          path: gh-pages
          ref: gh-pages

      - name: Copy package to gh-pages structure
        if: steps.package-charts.outputs.has_changes == 'true'
        id: copy-package
        env:
          PACKAGES_FILES: ${{ steps.package-charts.outputs.result }}
        run: |
          mkdir -p "gh-pages/charts"
          cp ${PACKAGES_FILES} "gh-pages/charts"

      - name: Generate index
        if: steps.package-charts.outputs.has_changes == 'true'
        working-directory: gh-pages
        run: |
          helm repo index . --url https://${GITHUB_REPOSITORY_OWNER}.github.io/helm-charts/ --merge index.yaml
          echo "Index generated successfully"

      - name: Publish to GitHub Pages
        if: steps.package-charts.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "release: update helm repository"
          repository: gh-pages
          branch: gh-pages
          file_pattern: "index.yaml **/*.tgz"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
